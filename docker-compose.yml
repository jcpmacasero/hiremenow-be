services:
  postgres:
    image: postgres:16-alpine
    container_name: hiremenow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hiremenow
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: hiremenow_db
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiremenow -d hiremenow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
